name: Deploy Blog to Cloud Server

on:
  push:
    branches:
      - main # 当推送到 main 分支时自动触发部署
  workflow_dispatch: # 支持在 GitHub 网页上手动点击按钮触发部署

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 安装依赖
        run: npm ci || npm install

      - name: 编译构建静态网页
        run: npm run build

      - name: 同步部署到云服务器 (通过 SSH / rsync)
        uses: easingthemes/ssh-deploy@v5.1.0
        with:
          # SSH 私钥，在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中添加
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
          # 待同步的本地构建目录 (Astro 打包产物在 dist/)
          SOURCE: "dist/"
          # 你的云服务器公网 IP 或域名
          REMOTE_HOST: ${{ secrets.SERVER_HOST }}
          # 服务器登录用户名 (例如 root 或 ubuntu)
          REMOTE_USER: ${{ secrets.SERVER_USER }}
          # 服务器 SSH 端口 (默认 22)
          REMOTE_PORT: ${{ secrets.SERVER_PORT || 22 }}
          # 云服务器上存放博客网页的绝对路径
          TARGET: "/var/www/blog"
          # 同步时删除服务器目标目录中已不存在的多余文件
          ARGS: "-rlgoDzc -i --delete"
